<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css"
    />
    <title>Importar Estoque</title>
  </head>
  <body>
    <div class="bg-glow"></div>

    <main class="container">
      <header class="hero">
        <span class="badge"><span class="badge-dot"></span>Importador de Estoque</span>
        <h1 id="title">Carregue seu arquivo Excel</h1>
        <p class="subtitle">
          Envie a planilha para gerar a lista de produtos com estoque
          negativo, pronta para ajuste manual de quantidade.
        </p>
      </header>

      <section class="content">
        <div class="content-input">
          <div class="content-actions">
            <button id="btnProcessar">
              <svg
                class="btn-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              </svg>
              Carregar planilha
            </button>
          </div>
        </div>

        <p class="hint">Formatos aceitos: .xlsx e .xls</p>
      </section>

      <div id="secao" class="resultado-section"></div>
    </main>

    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  </body>
</html>
